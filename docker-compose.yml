services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Pin the issuer identity to the address the BROWSER uses, no matter
      # which address actually reached Keycloak to ask - otherwise the
      # browser-facing login (public URL) and the server-to-server token
      # exchange (internal Docker URL) would mint tokens with two different
      # `iss` values and Auth.js would reject the mismatch. Dynamic lets the
      # token/userinfo/jwks *service* URLs still adapt per-caller so internal
      # callers get a reachable address instead of the (unreachable from
      # inside a container) public one.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./infra/keycloak/themes/pnc-ssms:/opt/keycloak/themes/pnc-ssms
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      # Authority: where the backend actually reaches Keycloak to fetch JWKS -
      # the internal Docker address, since this is a pure server-to-server call.
      # Issuer: what every token's `iss` claim actually says - pinned to the
      # public address by KC_HOSTNAME on the keycloak service below, regardless
      # of which address was used to reach it.
      Keycloak__Authority: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      Keycloak__Issuer: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      Keycloak__Audience: ${KEYCLOAK_API_CLIENT_ID}
      Keycloak__RequireHttpsMetadata: "false"
      Frontend__Origin: ${FRONTEND_ORIGIN}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_KEYCLOAK_ID: ${KEYCLOAK_WEB_CLIENT_ID}
      AUTH_KEYCLOAK_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
      # The issuer identity (matches every token's `iss` claim, pinned to this
      # public address by KC_HOSTNAME below) - NOT necessarily where this
      # server actually connects to reach Keycloak.
      AUTH_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      # Only set inside Docker: auth.ts rewrites requests that would otherwise
      # target the (unreachable-from-a-container) public address above to this
      # internal one instead, without changing what issuer it expects back.
      AUTH_KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - keycloak

volumes:
  keycloak-db-data:
