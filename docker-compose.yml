services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      # Internal address: the backend only ever validates bearer tokens
      # server-to-server, it never redirects a browser to Keycloak, so it
      # can always use the Docker-internal hostname.
      Keycloak__Authority: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      Keycloak__Audience: ${KEYCLOAK_API_CLIENT_ID}
      Keycloak__RequireHttpsMetadata: "false"
      Frontend__Origin: ${FRONTEND_ORIGIN}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_KEYCLOAK_ID: ${KEYCLOAK_WEB_CLIENT_ID}
      AUTH_KEYCLOAK_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
      # Internal address: this server performs the token/userinfo/jwks calls
      # itself, so it reaches Keycloak over the Docker network.
      AUTH_KEYCLOAK_ISSUER: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      # Public address: the browser is redirected here to log in, so it must
      # be the address published on the host, not the Docker-internal one.
      AUTH_KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - keycloak

volumes:
  keycloak-db-data:
